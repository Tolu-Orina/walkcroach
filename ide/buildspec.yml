version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo "WalkCroach IDE + agent-engine unit / typecheck / build"
  build:
    commands:
      - |
        set -eu
        # file: deps — dist/ is gitignored. --include=dev for typescript under NODE_ENV=production.
        cd packages/memory-contracts
        npm ci --include=dev
        npm run build

        cd ../sdk
        npm ci --include=dev
        npm run build

        cd ../agent-engine
        npm ci --include=dev
        npm run typecheck
        npm run test
        npm run build
      - |
        set -eu
        cd ide
        npm ci --include=dev
        npm run typecheck
        npm run test
        npm run build
        # §7D — fail closed on a listing that would publish broken.
        npm run check:publishable
        npm run package:vsix
artifacts:
  files:
    - ide/walkcroach-ide.vsix
    - ide/dist/**/*
    - ide/media/**/*
    - packages/agent-engine/dist/**/*
  name: ide-unit-test
