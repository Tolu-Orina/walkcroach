name: Publish IDE extension

# Master plan §7D. The publishing path existed only as two lines in
# ide/INSTALL.md ("after enrollment, run ovsx publish"), which is a recipe, not
# a pipeline — nothing verified the listing metadata or the built bundle.
#
# CodeBuild still builds and tests (ide/buildspec.yml). This job re-runs the
# gates rather than trusting an artifact it did not produce, then publishes.
#
# Before the first run, once:
#   1. Enrol the `walkcroach` publisher at https://open-vsx.org (GitHub sign-in,
#      then sign the publisher agreement).
#   2. Create an access token and store it as the `OVSX_PAT` secret in the
#      `ovsx-publish` environment.
#   3. For the VS Code Marketplace as well, add `VSCE_PAT` the same way and
#      un-comment the final step.
#
# Unlike the CLI's npm workflow, Open VSX has no OIDC trusted-publishing
# equivalent, so a stored token is unavoidable here. It is scoped to an
# environment with required reviewers rather than sitting in repo-wide secrets.

on:
  push:
    tags:
      - 'ide-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ovsx-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: Node 20 is past end-of-life. This job does not install a
          # global npm, so it was not hit by the npm 12 engine bump — aligned
          # anyway so both release paths build on the same runtime.
          node-version: 22

      - name: Build the engine the extension bundles
        working-directory: packages/agent-engine
        run: |
          npm ci
          npm run build

      - name: Install, typecheck, test
        working-directory: ide
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build, size-check and verify the listing
        working-directory: ide
        # package:vsix runs build → check:bundle → check:publishable → vsce.
        run: npm run package:vsix

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ide
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/ide-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ide-v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - name: Upload the VSIX
        uses: actions/upload-artifact@v4
        with:
          name: walkcroach-ide-vsix
          path: ide/walkcroach-ide.vsix

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        working-directory: ide
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish walkcroach-ide.vsix -p "$OVSX_PAT"

      # - name: Publish to the VS Code Marketplace
      #   if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
      #   working-directory: ide
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      #   run: npx --yes @vscode/vsce publish --packagePath walkcroach-ide.vsix -p "$VSCE_PAT"
