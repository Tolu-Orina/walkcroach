version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo "Backend unit / typecheck"
      - node -v
      - npm -v
  build:
    commands:
      - |
        set -eu
        # file: dep of agent-harness — dist/ is gitignored; no prepare script
        # (prepare broke npm ci when typescript was not on PATH yet).
        cd packages/memory-contracts
        npm ci --include=dev
        npm run build
      - |
        set -eu
        cd infra-backend
        npm ci
        # Root typecheck builds packages (dist/) then runs tsc in each workspace
        npm run typecheck
        npm run test
artifacts:
  files:
    - '**/*'
  name: backend-unit-test
