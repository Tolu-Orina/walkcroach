version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo "Backend unit / typecheck"
      - node -v
      - npm -v
  build:
    commands:
      - |
        set -eu
        # build:shared (via typecheck → build:packages) npm ci's + builds
        # memory-contracts, agent-engine, and sdk-host under packages/.
        cd "${CODEBUILD_SRC_DIR}/infra-backend"
        npm ci
        npm run typecheck
        npm run test
artifacts:
  files:
    - '**/*'
  name: backend-unit-test
