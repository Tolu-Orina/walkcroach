version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo "Backend unit / typecheck"
      - node -v
      - npm -v
  build:
    commands:
      - |
        set -eu
        # Private file: packages — dist/ is gitignored. Build before infra-backend
        # typecheck (ide-api → sdk-host → agent-engine; harness → memory-contracts).
        # Use CODEBUILD_SRC_DIR: cd persists across commands in a phase.
        cd "${CODEBUILD_SRC_DIR}/packages/memory-contracts"
        npm ci --include=dev
        npm run build

        cd "${CODEBUILD_SRC_DIR}/packages/agent-engine"
        npm ci --include=dev
        npm run build

        cd "${CODEBUILD_SRC_DIR}/packages/sdk-host"
        npm ci --include=dev
        npm run build

        cd "${CODEBUILD_SRC_DIR}/infra-backend"
        npm ci
        # Root typecheck builds workspace packages (dist/) then tsc in each
        npm run typecheck
        npm run test
artifacts:
  files:
    - '**/*'
  name: backend-unit-test
