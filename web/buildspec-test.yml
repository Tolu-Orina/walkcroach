version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo "Web + Chrome + IDE + CLI unit / typecheck"
  build:
    commands:
      - |
        set -eu
        # file: deps — dist/ is gitignored. Build shared packages before any consumer.
        # --include=dev: CodeBuild NODE_ENV=production would skip typescript.
        cd packages/memory-contracts
        npm ci --include=dev
        npm run build

        cd ../sdk
        npm ci --include=dev
        npm run build

        cd ../templates
        npm ci --include=dev
        npm run build
        npm test
      - |
        set -eu
        cd web
        npm ci --include=dev
        npm run typecheck
        npm run test:coverage
        npm run scan:secrets
      - |
        set -eu
        cd chrome
        npm ci --include=dev
        npm run typecheck
        npm run test:coverage
        npm run build
      - |
        set -eu
        cd packages/agent-engine
        npm ci --include=dev
        npm run typecheck
        npm run test:coverage
        npm run build
      - |
        set -eu
        cd cli
        npm ci --include=dev
        npm run typecheck
        npm run test:coverage
      - |
        set -eu
        cd ide
        npm ci --include=dev
        npm run typecheck
        npm run test:coverage
        npm run build
        npm run check:bundle
artifacts:
  files:
    - '**/*'
  name: web-unit-test
