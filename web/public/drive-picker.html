<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attach from Google Drive</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #161410;
        color: #f4efe6;
        font: 14px/1.45 system-ui, sans-serif;
      }
      #status {
        padding: 1.5rem 1.75rem;
        max-width: 36rem;
      }
      #status.error {
        color: #f0a8a0;
      }
      #status code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <p id="status">Loading Google Drive…</p>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
      (function () {
        const CFG_PREFIX = 'wc-drive-picker:cfg:';
        const OUT_PREFIX = 'wc-drive-picker:out:';
        const statusEl = document.getElementById('status');
        const sid = new URLSearchParams(window.location.search).get('sid');

        if (!sid) {
          statusEl.className = 'error';
          statusEl.textContent = 'Missing picker session. Close this window and try Attach again.';
          return;
        }

        const cfgKey = CFG_PREFIX + sid;
        const outKey = OUT_PREFIX + sid;
        let started = false;
        let loaded = false;
        let settled = false;

        const writeOut = (payload) => {
          if (settled) return;
          settled = true;
          try {
            localStorage.setItem(outKey, JSON.stringify(payload));
          } catch (err) {
            console.error(err);
          }
        };

        const failStayOpen = (message) => {
          statusEl.className = 'error';
          statusEl.textContent = message;
          writeOut({ type: 'error', message: message });
        };

        if (window.crossOriginIsolated) {
          failStayOpen(
            'This window is still cross-origin isolated (COEP). Google Drive cannot load here. Close this window — /drive-picker.html must be served without Cross-Origin-Embedder-Policy.',
          );
          return;
        }

        const startPicker = (cfg) => {
          if (started) return;
          started = true;
          localStorage.removeItem(cfgKey);

          const { accessToken, apiKey, appId, maxItems } = cfg || {};
          if (!accessToken || !apiKey || !appId) {
            failStayOpen('Picker configuration incomplete. Close this window and try again.');
            return;
          }

          const gapi = window.gapi;
          if (!gapi) {
            failStayOpen('Google API failed to load. Check the network tab for apis.google.com.');
            return;
          }

          gapi.load('picker', () => {
            const pickerNs = window.google && window.google.picker;
            if (!pickerNs) {
              failStayOpen('Google Picker failed to initialize.');
              return;
            }

            let view = pickerNs.ViewId.DOCS;
            if (pickerNs.DocsView && pickerNs.DocsViewMode && pickerNs.DocsViewMode.LIST) {
              view = new pickerNs.DocsView(pickerNs.ViewId.DOCS)
                .setMode(pickerNs.DocsViewMode.LIST)
                .setIncludeFolders(true)
                .setSelectFolderEnabled(false);
              if (view.setEnableDrives) view.setEnableDrives(true);
            }

            const visibleAt = Date.now();
            let builder = new pickerNs.PickerBuilder()
              .addView(view)
              .enableFeature(pickerNs.Feature.MULTISELECT_ENABLED)
              .setOAuthToken(accessToken)
              .setDeveloperKey(apiKey)
              .setAppId(String(appId))
              .setOrigin(window.location.origin)
              .setCallback((data) => {
                const action = data && data.action;
                if (action === pickerNs.Action.LOADED) {
                  loaded = true;
                  statusEl.textContent = '';
                  return;
                }
                if (action === pickerNs.Action.PICKED) {
                  const ids = (data.docs || []).map((d) => d.id).filter(Boolean);
                  writeOut({ type: 'picked', fileIds: ids });
                  window.close();
                  return;
                }
                if (action === pickerNs.Action.CANCEL) {
                  // Picker often fires CANCEL as it mounts; ignore until it has loaded
                  // and a short grace period has passed.
                  if (!loaded || Date.now() - visibleAt < 1200) return;
                  writeOut({ type: 'cancel' });
                  window.close();
                }
              });

            if (pickerNs.Feature.SUPPORT_DRIVES) {
              builder = builder.enableFeature(pickerNs.Feature.SUPPORT_DRIVES);
            }
            if (builder.setMaxItems && maxItems) {
              builder = builder.setMaxItems(maxItems);
            }
            if (builder.setTitle) {
              builder = builder.setTitle('Attach from Google Drive');
            }
            if (builder.setSize) {
              builder = builder.setSize(
                Math.max(640, window.innerWidth - 16),
                Math.max(480, window.innerHeight - 16),
              );
            }

            builder.build().setVisible(true);
          });
        };

        const tryReadCfg = () => {
          const raw = localStorage.getItem(cfgKey);
          if (!raw) return false;
          try {
            startPicker(JSON.parse(raw));
            return true;
          } catch (err) {
            failStayOpen('Could not read picker configuration.');
            return true;
          }
        };

        if (!tryReadCfg()) {
          const wait = window.setInterval(() => {
            if (tryReadCfg() || started) window.clearInterval(wait);
          }, 50);
          window.setTimeout(() => {
            window.clearInterval(wait);
            if (!started) {
              failStayOpen(
                'Timed out waiting for WalkCroach to send picker credentials. Close this window and try Attach again.',
              );
            }
          }, 8000);
        }
      })();
    </script>
  </body>
</html>
